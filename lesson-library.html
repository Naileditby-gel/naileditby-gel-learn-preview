<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#754c5a"><title>Naileditby_gel Learn</title><style>:root{--rose:#754c5a;--pink:#f8edf0;--gold:#b89a62;--ink:#493940;--muted:#786a70;--paper:#fffaf8;--line:#eadde0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Georgia;line-height:1.6}.wrap{width:min(1000px,calc(100% - 32px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0}a{color:var(--rose)}h1,h2,h3{color:var(--rose);font-weight:400;line-height:1.2}h1{font-size:clamp(34px,5vw,48px)}h2{font-size:30px}.muted{color:var(--muted);font-size:14px}.eyebrow{font:11px Arial;letter-spacing:.16em;color:var(--gold)}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.btn,button{display:inline-block;border:0;border-radius:26px;padding:12px 20px;background:var(--rose);color:white;text-decoration:none;font:13px Arial;cursor:pointer}.secondary{background:var(--pink);color:var(--rose)}.pill{display:inline-block;border:1px solid var(--line);border-radius:18px;padding:4px 10px;font:10px Arial;color:var(--rose)}.notice{background:var(--pink);border-radius:12px;padding:16px;color:var(--rose)}footer{text-align:center;padding:30px;color:var(--muted);font:11px Arial}.hidden{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><div class="wrap"><header><a href="account.html"><b>Naileditby_gel Learn</b></a><a href="account.html">← Back to learning hub</a></header><main><div class="eyebrow">YOUR LEARNING LIBRARY</div><h1>Beginner lessons</h1><p class="muted">Your Beginner learning path, from foundations to preparation.</p><div id="message" class="notice">Checking your learning access…</div><section id="lessons" class="grid"></section></main></div><footer>Naileditby_gel Learn · Learn. Practice. Perfect.</footer><script>(()=>{const sb=window.supabase.createClient('https://vlocuitjamseqpzqohgs.supabase.co','sb_publishable_bodb7BhOwkONRc5gy41ZLQ_pYOKCfCa');const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){$('message').innerHTML='Please <a href="account.html">sign in</a> to view your lessons.';return}const {data:course}=await sb.from('learning_courses').select('id').eq('slug','beginner').maybeSingle();if(!course){$('message').textContent='Beginner lessons are currently unavailable.';return}const {data:enrollment}=await sb.from('learning_enrollments').select('id').eq('user_id',session.user.id).eq('course_id',course.id).maybeSingle();const lessons=[['nail-anatomy','Nail Anatomy & Terminology','lesson-01-full.html','preview-lesson-01.html'],['nail-hygiene','Nail Hygiene, Sanitation & Disinfection','lesson-02-full.html','purchase.html?course=beginner'],['nail-tools-equipment','Nail Tools, Equipment & Products','lesson-03-full.html','purchase.html?course=beginner'],['natural-nail-preparation','Natural Nail Preparation','lesson-04-full.html','purchase.html?course=beginner']];$('message').textContent=enrollment?'Your Beginner enrollment is active. Enjoy your lessons!':'Lesson 1 has a free preview. Enroll in the Beginner path to unlock the complete lessons.';$('lessons').innerHTML=lessons.map((l,i)=>{const href=enrollment?l[2]:l[3];const label=enrollment?'Open lesson →':i===0?'Free preview →':'Locked · Enroll to unlock';return '<article class="card"><span class="pill">LESSON '+(i+1)+'</span><h2>'+esc(l[1])+'</h2><p class="muted">'+(enrollment?'Included in your Beginner lifetime access.':i===0?'Try the free preview.':'Available after payment approval.')+'</p><a class="btn '+(enrollment||i===0?'':'secondary')+'" href="'+href+'">'+label+'</a></article>'}).join('')}init()})();</script></body></html>
