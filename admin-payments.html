<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#754c5a"><title>Payment Review | Naileditby_gel Learn</title>
<style>
:root{--rose:#754c5a;--pink:#f8edf0;--gold:#b89a62;--ink:#493940;--muted:#786a70;--paper:#fffaf8;--line:#eadde0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Georgia;line-height:1.55}.wrap{width:min(1100px,calc(100% - 30px));margin:auto}header{padding:22px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:var(--rose)}h1,h2,h3{color:var(--rose);font-weight:400}.panel,.payment{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;margin:16px 0}.muted{color:var(--muted);font:13px Arial}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--rose);font:11px Arial}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:22px;padding:11px 18px;background:var(--rose);color:white;cursor:pointer}button.alt{background:#f5e8eb;color:var(--rose)}button:disabled{opacity:.5}textarea{width:100%;min-height:70px;padding:12px;border:1px solid var(--line);border-radius:10px;font:14px Arial}img.proof{display:block;max-width:min(100%,520px);max-height:520px;object-fit:contain;margin:12px 0;border:1px solid var(--line);border-radius:12px}.message{padding:13px;background:var(--pink);border-radius:12px;margin:12px 0}.hidden{display:none!important}.payment-summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.detail-view{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin:16px 0}.back-link{display:inline-block;text-decoration:none;background:#f5e8eb;color:var(--rose);border:1px solid var(--line);border-radius:22px;padding:9px 14px;font:13px Arial}.back-link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head>
<body><div class="wrap"><header><a href="index.html"><b>Naileditby_gel Learn</b></a><div class="row"><a class="back-link" href="admin-dashboard.html">← Owner dashboard</a><a href="account.html">Student view</a><button id="signout" class="alt">Sign out</button></div></header>
<section class="panel"><div class="row"><div><p class="muted">OWNER AREA</p><h1>Payment review</h1><p class="muted">Review receipts before granting lifetime learning access.</p></div><button id="refresh" class="alt">Refresh list</button></div><div id="notice" class="message">Checking owner access…</div></section>
<section id="queue"></section></div>
<script>
(()=>{const sb=window.supabase.createClient('https://vlocuitjamseqpzqohgs.supabase.co','sb_publishable_bodb7BhOwkONRc5gy41ZLQ_pYOKCfCa');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let allowed=false;
function note(t){$('notice').textContent=t}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){note('Please sign in with your owner account first.');return}if(session.user.app_metadata?.role!=='owner'){note('Access restricted. This account does not have the owner role.');return}allowed=true;note('Owner access confirmed. Payment decisions are protected by database authorization.');await load()}
async function load(){if(!allowed)return;$('queue').textContent='Loading payment submissions…';const {data,error}=await sb.from('learning_payments').select('id,user_id,order_id,amount_php,payment_method,payment_reference,proof_storage_path,status,submitted_at,owner_note,order:learning_orders(id,status,course:learning_courses(title))').order('submitted_at',{ascending:false});if(error){$('queue').textContent='Unable to load payments: '+error.message;return}if(!data?.length){$('queue').innerHTML='<section class="panel">No payment submissions yet.</section>';return}
const pending=data.filter(p=>p.status==='submitted'), reviewed=data.filter(p=>p.status!=='submitted');
$('queue').innerHTML=(pending.length?'<h2>Awaiting review ('+pending.length+')</h2>':'<h2>No payments awaiting review</h2>')+pending.map(summary).join('')+(reviewed.length?'<h2>Reviewed payments</h2>'+reviewed.map(summary).join(''):'')+'<section id="paymentDetail" class="detail-view hidden"><button type="button" class="back-link" id="backToPayments">← Back to payment list</button><div id="paymentDetailContent"></div></section>';
document.querySelectorAll('[data-view-payment]').forEach(b=>b.addEventListener('click',()=>openPayment(data.find(p=>p.id===b.dataset.viewPayment))));
}
function summary(p){const title=p.order?.course?.title||'Learning path';return '<article class="payment-summary"><div class="row"><div><span class="pill">'+esc(p.status==='submitted'?'PENDING REVIEW':p.status.toUpperCase())+'</span><h3>'+esc(title)+'</h3><span class="muted">'+new Date(p.submitted_at).toLocaleString()+'</span></div><div><strong>₱'+Number(p.amount_php).toFixed(2)+'</strong><br><button type="button" class="alt" style="margin-top:10px" data-view-payment="'+p.id+'">View Details →</button></div></div></article>'}
async function openPayment(p){if(!p)return;const detail=$('paymentDetail');detail.classList.remove('hidden');$('queue').querySelectorAll('.payment-summary').forEach(el=>el.classList.add('hidden'));$('queue').querySelectorAll('h2').forEach(el=>el.classList.add('hidden'));$('paymentDetailContent').innerHTML=card(p);const el=document.querySelector('[data-proof="'+p.id+'"]');if(p.proof_storage_path){const {data:signed,error}=await sb.storage.from('learning-payment-proofs').createSignedUrl(p.proof_storage_path,300);if(!error&&signed?.signedUrl){const img=document.createElement('img');img.className='proof';img.alt='Payment receipt';img.src=signed.signedUrl;el?.appendChild(img)}else if(el)el.textContent='Receipt unavailable: '+(error?.message||'unknown error')}document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>review(b.dataset.id,b.dataset.action)));$('backToPayments').onclick=()=>{detail.classList.add('hidden');$('queue').querySelectorAll('.payment-summary,h2').forEach(el=>el.classList.remove('hidden'));window.scrollTo({top:0,behavior:'smooth'})};detail.scrollIntoView({behavior:'smooth',block:'start'})}
function card(p){const title=p.order?.course?.title||'Learning path';return '<article class="payment"><div class="row"><div><span class="pill">'+esc(p.status==='submitted'?'PENDING REVIEW':p.status.toUpperCase())+'</span><h3>'+esc(title)+'</h3></div><strong>₱'+Number(p.amount_php).toFixed(2)+'</strong></div><p class="muted">Submitted: '+new Date(p.submitted_at).toLocaleString()+'</p><p><b>Method:</b> '+esc(p.payment_method)+'<br><b>Reference:</b> '+esc(p.payment_reference||'—')+'<br><b>Student ID:</b> '+esc(p.user_id)+'</p><div data-proof="'+p.id+'">'+(p.proof_storage_path?'Loading private receipt…':'No receipt attached')+'</div>'+(p.status==='submitted'?'<label for="note-'+p.id+'">Note to student (optional)</label><textarea id="note-'+p.id+'" maxlength="1000" placeholder="Add a message if needed"></textarea><div class="row" style="margin-top:12px"><button data-id="'+p.id+'" data-action="rejected">Reject payment</button><button data-id="'+p.id+'" data-action="approved">Approve & grant access</button></div>':'<div class="message">Review note: '+esc(p.owner_note||'No note')+'</div>')+'</article>'}
async function review(id,decision){const b=[...document.querySelectorAll('[data-id="'+id+'"]')];b.forEach(x=>x.disabled=true);const ownerNote=document.getElementById('note-'+id)?.value||null;const {data,error}=await sb.rpc('learning_review_payment',{p_payment_id:id,p_decision:decision,p_owner_note:ownerNote});if(error){note('Could not '+decision+' payment: '+error.message);b.forEach(x=>x.disabled=false);return}note(decision==='approved'?'Payment approved. Lifetime enrollment has been granted.':'Payment rejected. Student can see your review note.');await load()}
$('refresh').onclick=load;$('signout').onclick=async()=>{await sb.auth.signOut();location.href='account.html'};sb.auth.onAuthStateChange(()=>setTimeout(init,0));init()})();
</script></body></html>
